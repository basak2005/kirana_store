{% extends 'base.html' %}

{% block title %}New Purchase - Kirana Store{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="fas fa-truck"></i> New Purchase Order
                </h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="supplier" class="form-label">Supplier *</label>
                            <select class="form-select" id="supplier" name="supplier" required>
                                <option value="">Select Supplier</option>
                                {% for supplier in suppliers %}
                                    <option value="{{ supplier.pk }}">{{ supplier.name }} - {{ supplier.phone }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="expected_delivery" class="form-label">Expected Delivery</label>
                            <input type="date" class="form-control" id="expected_delivery" name="expected_delivery">
                        </div>
                    </div>
                    
                    <!-- Items Table -->
                    <div class="table-responsive mb-4">
                        <table class="table items-table">
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>Quantity</th>
                                    <th>Unit Cost</th>
                                    <th>GST (%)</th>
                                    <th>Total</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="item-row">
                                    <td>
                                        <select class="form-select" name="product[]" required>
                                            <option value="">Select Product</option>
                                            {% for product in products %}
                                                <option value="{{ product.pk }}">{{ product.name }}{% if product.brand %} ({{ product.brand }}){% endif %}</option>
                                            {% endfor %}
                                        </select>
                                    </td>
                                    <td>
                                        <input type="number" class="form-control quantity-input" name="quantity[]" min="1" value="1" required>
                                    </td>
                                    <td>
                                        <input type="number" class="form-control currency-input price-input" name="cost[]" step="0.01" required>
                                    </td>
                                    <td>
                                        <input type="number" class="form-control gst-rate" name="gst[]" step="0.01" min="0" max="100" value="0">
                                    </td>
                                    <td class="total-cell">₹0.00</td>
                                    <td>
                                        <button type="button" class="btn btn-sm btn-danger remove-item-btn">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <button type="button" class="btn btn-sm btn-secondary add-item-btn">
                            <i class="fas fa-plus"></i> Add Item
                        </button>
                    </div>
                    
                    <!-- Total Section -->
                    <div class="row">
                        <div class="col-md-8">
                            <div class="mb-3">
                                <label for="notes" class="form-label">Notes</label>
                                <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card bg-light">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between">
                                        <span>Subtotal:</span>
                                        <span class="subtotal">₹0.00</span>
                                    </div>
                                    <div class="d-flex justify-content-between">
                                        <span>GST:</span>
                                        <span class="gst-amount">₹0.00</span>
                                    </div>
                                    <hr>
                                    <div class="d-flex justify-content-between">
                                        <strong>Total:</strong>
                                        <strong class="grand-total">₹0.00</strong>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between mt-3">
                        <a href="{% url 'suppliers:purchase_orders' %}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Back
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Create Purchase Order
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const addItemBtn = document.querySelector('.add-item-btn');
    const itemsTableBody = document.querySelector('.items-table tbody');

    addItemBtn.addEventListener('click', function() {
        const firstRow = itemsTableBody.querySelector('.item-row');
        const newRow = firstRow.cloneNode(true);
        // Reset values in new row
        newRow.querySelectorAll('select, input').forEach(function(input) {
            if (input.type === 'number') {
                input.value = input.name === 'quantity[]' ? 1 : '';
            } else {
                input.value = '';
            }
        });
        newRow.querySelector('.total-cell').textContent = '₹0.00';
        itemsTableBody.appendChild(newRow);
        // Ensure each input has a unique name attribute for cost[]
        updateInputNames();
    });

    itemsTableBody.addEventListener('click', function(e) {
        if (e.target.closest('.remove-item-btn')) {
            const rows = itemsTableBody.querySelectorAll('.item-row');
            if (rows.length > 1) {
                e.target.closest('.item-row').remove();
                updateInputNames();
            }
        }
    });

    function updateInputNames() {
        // For each item row, update the name attributes to be cost[0], cost[1], ...
        const rows = itemsTableBody.querySelectorAll('.item-row');
        rows.forEach(function(row, idx) {
            const costInput = row.querySelector('input[name="cost[]"]');
            if (costInput) {
                costInput.name = `cost[${idx}]`;
            }
            const qtyInput = row.querySelector('input[name="quantity[]"]');
            if (qtyInput) {
                qtyInput.name = `quantity[${idx}]`;
            }
            const gstInput = row.querySelector('input[name="gst[]"]');
            if (gstInput) {
                gstInput.name = `gst[${idx}]`;
            }
            const prodSelect = row.querySelector('select[name="product[]"]');
            if (prodSelect) {
                prodSelect.name = `product[${idx}]`;
            }
        });
    }
    // Initial call to set unique names
    updateInputNames();
});
</script>
{% endblock %}
