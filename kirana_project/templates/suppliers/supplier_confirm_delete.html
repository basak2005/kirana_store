{% extends 'base.html' %}
{% block title %}Delete Supplier - {{ supplier.name }}{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0"><i class="fas fa-trash me-2"></i>Delete Supplier</h4>
                </div>
                <div class="card-body">
                    <p>Are you sure you want to delete supplier <strong>{{ supplier.name }}</strong>?</p>
                    <p class="text-danger">This action cannot be undone.</p>
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger"><i class="fas fa-trash me-2"></i>Delete</button>
                        <a href="{% url 'suppliers:supplier_detail' supplier.pk %}" class="btn btn-secondary ms-2">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
